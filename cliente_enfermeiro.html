<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Notificações - Enfermeiros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-container {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .filtros {
            display: flex;
            gap: 10px;
        }

        .filtro-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .filtro-btn.ativo {
            background-color: #667eea;
            color: white;
        }

        .filtro-btn.inativo {
            background-color: #e0e0e0;
            color: #666;
        }

        .filtro-btn:hover {
            transform: scale(1.05);
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        .status.conectado {
            background-color: #28a745;
            color: white;
        }

        .status.desconectado {
            background-color: #dc3545;
            color: white;
        }

        .status.reconectando {
            background-color: #ffc107;
            color: #000;
        }

        .alertas-container {
            padding: 20px 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .alertas-container::-webkit-scrollbar {
            width: 8px;
        }

        .alertas-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .alertas-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .alertas-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .alerta {
            border-left: 5px solid;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease-out;
            transition: all 0.3s;
            position: relative;
        }

        .alerta:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .alerta.urgente {
            background-color: #ffebee;
            border-color: #f44336;
        }

        .alerta.normal {
            background-color: #e3f2fd;
            border-color: #2196f3;
        }

        .alerta.resolvido {
            background-color: #f5f5f5;
            border-color: #9e9e9e;
            opacity: 0.7;
        }

        .alerta.resolvido .alerta-mensagem,
        .alerta.resolvido .alerta-paciente {
            text-decoration: line-through;
            color: #999;
        }

        .alerta-acoes {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-acao {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-resolver {
            background-color: #4caf50;
            color: white;
        }

        .btn-resolver:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .btn-remover {
            background-color: #f44336;
            color: white;
        }

        .btn-remover:hover {
            background-color: #da190b;
            transform: scale(1.05);
        }

        .badge-resolvido {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #4caf50;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
        }

        .alerta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .alerta-prioridade {
            font-weight: bold;
            font-size: 16px;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .urgente .alerta-prioridade {
            background-color: #f44336;
            color: white;
        }

        .normal .alerta-prioridade {
            background-color: #2196f3;
            color: white;
        }

        .alerta-timestamp {
            color: #666;
            font-size: 12px;
        }

        .alerta-paciente {
            font-weight: bold;
            color: #333;
            margin: 10px 0;
            font-size: 16px;
        }

        .alerta-mensagem {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-top: 10px;
        }

        .vazio {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 18px;
        }

        .vazio-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(244, 67, 54, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(244, 67, 54, 0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Central de Notificações</h1>
            <p>Sistema de Alertas em Tempo Real</p>
        </div>

        <div class="status-container">
            <div class="status-info">
                <div id="status" class="status desconectado">Desconectado</div>
                <span id="contador" style="color: #666;">
                    <span id="contador-pendentes">0</span> pendentes | 
                    <span id="contador-resolvidos">0</span> resolvidos
                </span>
            </div>
            <div class="filtros">
                <button class="filtro-btn ativo" data-filtro="todos" onclick="filtrarAlertas('todos')">Todos</button>
                <button class="filtro-btn inativo" data-filtro="pendentes" onclick="filtrarAlertas('pendentes')">Pendentes</button>
                <button class="filtro-btn inativo" data-filtro="resolvidos" onclick="filtrarAlertas('resolvidos')">Resolvidos</button>
            </div>
        </div>

        <div class="alertas-container">
            <div id="alertas"></div>
            <div id="vazio" class="vazio">
                <div class="vazio-icon">📭</div>
                <div>Aguardando notificações...</div>
                <div style="font-size: 14px; margin-top: 10px; color: #bbb;">
                    Quando um paciente fizer um gesto, você receberá uma notificação aqui.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração
        const WS_HOST = 'localhost';
        const WS_PORT = 8765;
        const WS_URL = `ws://${WS_HOST}:${WS_PORT}`;

        // Elementos DOM
        const statusDiv = document.getElementById('status');
        const alertasDiv = document.getElementById('alertas');
        const vazioDiv = document.getElementById('vazio');

        // Estado
        let contadorAlertas = 0;
        let contadorPendentes = 0;
        let contadorResolvidos = 0;
        let alertas = []; // Array para armazenar todos os alertas
        let filtroAtivo = 'todos';
        let ws = null;
        let tentativasReconexao = 0;
        const MAX_TENTATIVAS = 5;

        // Função para criar elemento de alerta
        function criarAlerta(data, id) {
            const alerta = document.createElement('div');
            alerta.className = `alerta ${data.prioridade === 'alta' ? 'urgente pulse' : 'normal'}`;
            alerta.dataset.alertaId = id;
            alerta.dataset.status = 'pendente';
            
            const icon = data.prioridade === 'alta' ? '🔴' : '⚪';
            const prioridadeTexto = data.prioridade === 'alta' ? 'URGENTE' : 'Normal';
            
            alerta.innerHTML = `
                <div class="alerta-header">
                    <span class="alerta-prioridade">${icon} ${prioridadeTexto}</span>
                    <span class="alerta-timestamp">${data.timestamp}</span>
                </div>
                <div class="alerta-paciente">👤 ${data.paciente}</div>
                <div class="alerta-mensagem">${data.mensagem}</div>
                <div class="alerta-acoes">
                    <button class="btn-acao btn-resolver" onclick="marcarComoResolvido('${id}')">
                        ✅ Marcar como Resolvido
                    </button>
                    <button class="btn-acao btn-remover" onclick="removerAlerta('${id}')">
                        🗑️ Remover
                    </button>
                </div>
            `;
            
            return alerta;
        }

        // Função para adicionar alerta
        function adicionarAlerta(data) {
            // Remove mensagem de vazio se existir
            if (vazioDiv.style.display !== 'none') {
                vazioDiv.style.display = 'none';
            }

            // Gera ID único para o alerta
            const id = `alerta-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            
            // Adiciona aos alertas
            const alertaData = {
                id: id,
                data: data,
                status: 'pendente',
                timestamp: Date.now()
            };
            alertas.unshift(alertaData); // Adiciona no início

            // Cria e adiciona novo alerta no topo
            const alertaElement = criarAlerta(data, id);
            alertasDiv.insertBefore(alertaElement, alertasDiv.firstChild);

            // Atualiza contadores
            contadorAlertas++;
            contadorPendentes++;
            atualizarContadores();

            // Reproduz som de alerta se for urgente
            if (data.prioridade === 'alta') {
                // Cria som de alerta usando Web Audio API
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }

            // Scroll para o topo para mostrar novo alerta
            alertasDiv.scrollTop = 0;
        }

        // Função para marcar alerta como resolvido
        function marcarComoResolvido(id) {
            const alertaElement = document.querySelector(`[data-alerta-id="${id}"]`);
            const alertaIndex = alertas.findIndex(a => a.id === id);
            
            if (alertaElement && alertaIndex !== -1) {
                // Atualiza status
                alertas[alertaIndex].status = 'resolvido';
                alertaElement.dataset.status = 'resolvido';
                
                // Atualiza visual
                alertaElement.classList.add('resolvido');
                alertaElement.classList.remove('urgente', 'normal', 'pulse');
                
                // Remove botão de resolver, mantém apenas remover
                const acoesDiv = alertaElement.querySelector('.alerta-acoes');
                acoesDiv.innerHTML = `
                    <span class="badge-resolvido">✅ Resolvido</span>
                    <button class="btn-acao btn-remover" onclick="removerAlerta('${id}')">
                        🗑️ Remover
                    </button>
                `;
                
                // Atualiza contadores
                contadorPendentes--;
                contadorResolvidos++;
                atualizarContadores();
                
                // Aplica filtro se necessário
                if (filtroAtivo === 'pendentes') {
                    alertaElement.style.display = 'none';
                }
                
                // Animação de confirmação
                alertaElement.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    alertaElement.style.transform = '';
                }, 200);
            }
        }

        // Função para remover alerta
        function removerAlerta(id) {
            const alertaElement = document.querySelector(`[data-alerta-id="${id}"]`);
            const alertaIndex = alertas.findIndex(a => a.id === id);
            
            if (alertaElement && alertaIndex !== -1) {
                // Animação de saída
                alertaElement.style.opacity = '0';
                alertaElement.style.transform = 'translateX(-100px)';
                
                setTimeout(() => {
                    // Remove do DOM
                    alertaElement.remove();
                    
                    // Remove do array
                    const status = alertas[alertaIndex].status;
                    alertas.splice(alertaIndex, 1);
                    
                    // Atualiza contadores
                    contadorAlertas--;
                    if (status === 'pendente') {
                        contadorPendentes--;
                    } else {
                        contadorResolvidos--;
                    }
                    atualizarContadores();
                    
                    // Mostra mensagem de vazio se não houver mais alertas
                    if (alertas.length === 0) {
                        vazioDiv.style.display = 'block';
                    }
                }, 300);
            }
        }

        // Função para atualizar contadores
        function atualizarContadores() {
            const contadorPendentesEl = document.getElementById('contador-pendentes');
            const contadorResolvidosEl = document.getElementById('contador-resolvidos');
            
            if (contadorPendentesEl) {
                contadorPendentesEl.textContent = contadorPendentes;
                contadorPendentesEl.style.color = contadorPendentes > 0 ? '#f44336' : '#666';
                contadorPendentesEl.style.fontWeight = contadorPendentes > 0 ? 'bold' : 'normal';
            }
            
            if (contadorResolvidosEl) {
                contadorResolvidosEl.textContent = contadorResolvidos;
            }
        }

        // Função para filtrar alertas
        function filtrarAlertas(filtro) {
            filtroAtivo = filtro;
            
            // Atualiza botões de filtro
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                if (btn.dataset.filtro === filtro) {
                    btn.classList.add('ativo');
                    btn.classList.remove('inativo');
                } else {
                    btn.classList.remove('ativo');
                    btn.classList.add('inativo');
                }
            });
            
            // Filtra alertas
            alertas.forEach(alertaData => {
                const alertaElement = document.querySelector(`[data-alerta-id="${alertaData.id}"]`);
                if (alertaElement) {
                    if (filtro === 'todos') {
                        alertaElement.style.display = '';
                    } else if (filtro === 'pendentes') {
                        alertaElement.style.display = alertaData.status === 'pendente' ? '' : 'none';
                    } else if (filtro === 'resolvidos') {
                        alertaElement.style.display = alertaData.status === 'resolvido' ? '' : 'none';
                    }
                }
            });
        }

        // Função para atualizar status
        function atualizarStatus(status, texto) {
            statusDiv.className = `status ${status}`;
            statusDiv.textContent = texto;
        }

        // Função para conectar WebSocket
        function conectar() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    tentativasReconexao = 0;
                    atualizarStatus('conectado', '✅ Conectado');
                    console.log('Conectado ao servidor WebSocket');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('Mensagem recebida:', data);
                        adicionarAlerta(data);
                    } catch (e) {
                        console.error('Erro ao processar mensagem:', e);
                    }
                };

                ws.onclose = () => {
                    atualizarStatus('desconectado', '❌ Desconectado');
                    console.log('Conexão WebSocket fechada');
                    
                    // Tenta reconectar após 3 segundos
                    if (tentativasReconexao < MAX_TENTATIVAS) {
                        tentativasReconexao++;
                        atualizarStatus('reconectando', `🔄 Reconectando... (${tentativasReconexao}/${MAX_TENTATIVAS})`);
                        setTimeout(conectar, 3000);
                    } else {
                        atualizarStatus('desconectado', '❌ Falha na conexão. Recarregue a página.');
                    }
                };

                ws.onerror = (error) => {
                    console.error('Erro WebSocket:', error);
                    atualizarStatus('desconectado', '❌ Erro na conexão');
                };

            } catch (e) {
                console.error('Erro ao criar conexão WebSocket:', e);
                atualizarStatus('desconectado', '❌ Erro ao conectar');
            }
        }

        // Inicia conexão quando página carrega
        window.addEventListener('load', () => {
            console.log('Iniciando conexão WebSocket...');
            conectar();
        });

        // Reconecta quando página ganha foco novamente
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && (!ws || ws.readyState === WebSocket.CLOSED)) {
                console.log('Página visível novamente, tentando reconectar...');
                conectar();
            }
        });
    </script>
</body>
</html>
